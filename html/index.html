<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Velora</title>

    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <div class="background">

        
        <div class="login-card">

            
            <div class="logo">
                <div class="logo-icon">V</div>
                <h1>Velora</h1>
            </div>

            <p class="welcome">
                Welcome back ✨
            </p>

            <p class="subtitle">
                Login to continue managing your projects.
            </p>


    
            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


              
                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                        >
                            👁
                        </button>

                    </div>
                </div>

                <div class="forgot-row">
                    <button
                        type="button"
                        id="forgotPassword"
                    >
                        Forgot password?
                    </button>
                </div>


                <button
                    type="submit"
                    id="loginBtn"
                    class="login-btn"
                >
                    Login
                </button>

                <p id="loginMessage"></p>

            </form>
            <div class="signup-text">

                Don't have an account?

                <a href="signup.html">
                    Create one
                </a>

            </div>

        </div>

    </div>


    <script
        type="module"
        src="../js/login.js">
    </script>

</body>

</html>
