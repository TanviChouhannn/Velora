<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup | Peony</title>

    <link rel="stylesheet" href="../css/signup.css">
</head>

<body>

    <div class="signup-page">

        
        <div class="signup-brand">

            <div class="brand-content">
                <h1>Velora</h1>
                

                <p>
                    Plan together.<br>
                    Work smarter. ✨
                </p>
            </div>

        </div>


        
        <div class="signup-container">

            <div class="signup-card">

                <h1>Create Account</h1>

                <p class="subtitle">
                    Join your team and get things done together.
                </p>


                
                <form id="signupForm">

                    
                    <div class="input-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    
                    <div class="input-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            placeholder="@username"
                            required
                        >

                    </div>


                    
                    <div class="input-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    
                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                placeholder="Create a password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    
                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your password"
                                required
                            >

                            <button
                                type="button"
                                id="toggleConfirmPassword"
                                class="password-toggle"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    
                    <p id="signupMessage"></p>


                    
                    <button
                        type="submit"
                        id="signupBtn"
                        class="signup-btn"
                    >
                        Create Account
                    </button>

                </form>


                <p class="login-text">

                    Already have an account?

                    <a href="index.html">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script
        type="module"
        src="../js/signup.js">
    </script>

</body>

</html>
